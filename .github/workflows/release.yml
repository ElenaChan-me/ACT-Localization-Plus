name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # プラグインは ACT 本体を参照してビルドする。ACT は同梱せず、作者の公開リリースから取得する
      - name: Fetch ACT
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo EQAditu/AdvancedCombatTracker --pattern "ACTv3.zip" --dir act
          Expand-Archive act/ACTv3.zip -DestinationPath act/extracted
          New-Item -ItemType Directory -Force lib | Out-Null
          Copy-Item "act/extracted/Advanced Combat Tracker.exe" lib/

      - name: Build translations
        shell: pwsh
        run: python tools/build_localization.py

      - name: Test
        run: dotnet test -c Release

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path src/ACTLocalizationPlus/bin/Release/net48/ACTLocalizationPlus.dll -DestinationPath act-localization-plus.zip
          gh release create "${{ github.ref_name }}" act-localization-plus.zip `
            --title "ACT Localization Plus ${{ github.ref_name }}" --notes "ACT Localization Plus ${{ github.ref_name }}"
